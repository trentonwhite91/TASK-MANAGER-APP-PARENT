networks:
  internal:
    internal: true

services:
  #  Application Services
  user-service:
    build:
      context: ../../TASK-MANAGER-APP-USER-SERVICE
      dockerfile: Dockerfile.app
    container_name: user-service-app
    ports: # No ports are published to the host 
      [] 
    expose: # Ports exposed for inter-service communication only
      - "8444"
    networks:
      - internal
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-service-db:5432/${USER_SERVICE_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${USER_SERVICE_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_SERVICE_POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      KEYSTORE_PASSWORD: ${USER_SERVICE_KEYSTORE_PASSWORD}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    depends_on:
      user-service-db:
        condition: service_healthy
  auth-service:
    build:
      context: ../../TASK-MANAGER-APP-AUTH-SERVICE
      dockerfile: Dockerfile.app
    container_name: auth-service-app
    ports: # No ports are published to the host 
      []  
    expose: # Ports exposed for inter-service communication only
      - "8445"
    networks:
      - internal
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/${AUTH_SERVICE_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${AUTH_SERVICE_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_SERVICE_POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      KEYSTORE_PASSWORD: ${AUTH_SERVICE_KEYSTORE_PASSWORD}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    depends_on:
      auth-service-db:
        condition: service_healthy
  api-gateway-service:
    build:
      context: ../../TASK-MANAGER-APP-API-GATEWAY
      dockerfile: Dockerfile.app
      args:
        KEYSTORE_PASSWORD: ${API_GATEWAY_KEYSTORE_PASSWORD}
    container_name: api-gateway-service-app
    ports: # Expose ports to host for external access
      - "8080:8080" 
      - "8443:8443" 
    networks:
      - internal
      - default
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      KEYSTORE_PASSWORD: ${API_GATEWAY_KEYSTORE_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      user-service:
        condition: service_started
      auth-service:
        condition: service_started

  # Database Services
  user-service-db:
    image: postgres:17
    container_name: user-service-db
    environment:
      POSTGRES_USER: ${USER_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_SERVICE_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_SERVICE_POSTGRES_USER} -d ${USER_SERVICE_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    volumes:
      - user-service-pgdata:/var/lib/postgresql
  auth-service-db:
    image: postgres:17
    container_name: auth-service-db
    environment:
      POSTGRES_USER: ${AUTH_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_SERVICE_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_SERVICE_POSTGRES_USER} -d ${AUTH_SERVICE_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    volumes:
      - auth-service-pgdata:/var/lib/postgresql

  # Messaging Services
  kafka:
    image: confluentinc/cp-kafka:8.1.1
    container_name: kafka
    networks:
      - internal
    expose:
      - "9092"
      - "9093"
    environment:
      # === KRaft mode ===
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # === Listeners (must include BOTH controller + broker) ===
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # === Required for storage formatting ===
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      # === Topic/cluster defaults ===
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  user-service-pgdata:
  auth-service-pgdata:
  kafka_data:
